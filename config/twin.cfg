# Settings for the digital twin only. The twin includes this file after
# printer.cfg; the printer never reads it.
#
# The trunnion is not wired on the printer yet. In the twin it runs as a
# full 5-axis machine: corexy_ac kinematics with the A tilt and C rotary
# axes on spare pins, and the trunnion joints of the 3D model turned on.

[printer]
kinematics: corexy_ac

[include printer/rotary.cfg]

[rotary_a]
step_pin: PB0
dir_pin: PB1
enable_pin: !PB2

[rotary_c]
step_pin: PE7
dir_pin: PE8
enable_pin: !PE10

[model_part tilt]
joint: rotary
axis: 1, 0, 0
origin: 175, 175, 5
source: a

[model_part rotary]
joint: rotary
axis: 0, 0, 1
origin: 175, 175, 0
source: c
