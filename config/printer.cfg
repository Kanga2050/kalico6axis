[include mainsail.cfg]
##--------------------------------------------------------------------
[save_variables]
filename: ~/variables.cfg
#   Required - provide a filename that would be used to save the
#   variables to disk e.g. ~/variables.cfg
##--------------------------------------------------------------------



##--------------------------------------------------------------------
[gcode_arcs]
resolution: 0.003125
#   An arc will be split into segments. Each segment's length will
#   equal the resolution in mm set above. Lower values will produce a
#   finer arc, but also more work for your machine. Arcs smaller than
#   the configured value will become straight lines. The default is
#   1mm.
##--------------------------------------------------------------------
[mcu]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_330019000651303532383235-if00
restart_method: command
##--------------------------------------------------------------------

[mcu nhk]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_rp2040_30333938340934D8-if00
restart_method: command
##--------------------------------------------------------------------

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 10000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

[include printer/xystepper.cfg]
[include printer/zstepper.cfg]
[include printer/extruder.cfg]
[include printer/bedheater.cfg]
[include printer/probe.cfg]
[include printer/fan.cfg]
[include printer/filament_sensor.cfg]
[include printer/led.cfg]
[include printer/accelerometer.cfg]
[include printer/temperature.cfg]
[include printer/homing.cfg]
[include printer/pins.cfg]
[include printer/display.cfg]
[include printer/macros/macros.cfg]
[include printer/retraction.cfg]
[include printer/model.cfg]
# 5-axis: change kinematics above to corexy_ac, then uncomment
#[include printer/rotary.cfg]

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 10
keep_raw_data: False
show_macros_in_webui: True
timeout: 600

