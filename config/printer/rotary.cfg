# Trunnion A (tilt about X) and C (rotary about Z) for Kalico corexy_ac.
# To use it, set "kinematics: corexy_ac" in printer.cfg and include this file.
#
# Pivots are in machine coordinates (mm), measured from the CAD with the
# rotary axis at the bed centre (175, 175) and Z = 0 on the PEI at A = 0:
#   [rotary_a] pivot = Y, Z of the tilt axis  -> 175, 5  (tilt axis is 5 mm above the PEI)
#   [rotary_c] pivot = X, Y of the rotary axis -> 175, 175
# Check them with a probe before printing; the twin reads them live.
#
# Pins are not set yet: the backup this repo was built from (2 Oct 2026)
# predates the trunnion wiring. Replace every PIN_TBD before including.

[rotary_a]
# Two NEMA17 48 mm motors, one per tilt holder, 16T -> 80T GT2 (5:1).
# corexy_ac drives one stepper per rotary axis, so wire both motors to
# one driver (parallel) or add a second driver and a [stepper] sync macro.
step_pin: PIN_TBD
dir_pin: PIN_TBD
enable_pin: !PIN_TBD
microsteps: 16
rotation_distance: 360
gear_ratio: 80:16
pivot: 175, 5
max_velocity: 90
max_accel: 900
position_min: -100
position_max: 100

[rotary_c]
# NEMA17 20 mm pancake, GT2 20T pulley -> belt around the rotary gear ring.
# 157 is estimated from the 100 mm ring in the CAD (pi x 100 / 2 mm pitch).
# Count the ring teeth and set gear_ratio to <teeth>:20.
step_pin: PIN_TBD
dir_pin: PIN_TBD
enable_pin: !PIN_TBD
microsteps: 16
rotation_distance: 360
gear_ratio: 157:20
pivot: 175, 175
max_velocity: 180
max_accel: 1800
