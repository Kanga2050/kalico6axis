# 3D model of the printer, shown in Mainsail's G-code viewer and the
# 3D Printer dashboard panel. Files are in config/models, exported from
# the Fusion CAD in Z-up millimetres.
#
# [model] is the fixed root part. Each [model_part] is joined to a parent:
#   joint:  fixed, linear or rotary
#   axis:   joint direction in machine coordinates
#   origin: a point on a rotary axis, machine coordinates (mm)
#   source: what drives the joint:
#           machine_x machine_y machine_z  physical toolhead position, from the motors
#           a b c                          rotary axis angle, from the motors
#           x y z e                        G-code position (the same as machine_*
#                                          only while every rotary axis is at 0)
#           <printer object>:<field>[.key], e.g. "manual_stepper tilt:position"
#           or "motion_report:live_steppers.stepper_z1"
#   home:   source value at which the part sits where it was exported
#   scale:  mm (or degrees) of joint motion per unit of source
#   minimum / maximum: optional joint limits
#   color:  optional rrggbb or rrggbbaa override, written without '#'

[model]
file: models/frame.glb
up_axis: z
# CAD -> machine: bed centre (177, 217) is machine (175, 175), PEI top is Z 0
offset: -2, -42, -127
# the print sits on the rotary platter, so the G-code viewer's toolpath turns with it
workpiece: rotary

[model_part panels]
file: models/panels.glb
# clear polycarbonate; colours are rrggbb or rrggbbaa (no '#', it starts a comment)
color: 00b9cd40

# The toolhead parts were exported with the nozzle tip at machine
# (175, 139.1, 0.7), so each joint's home is that axis of the tip.
[model_part gantry]
file: models/gantry.glb
joint: linear
axis: 0, 0, 1
source: machine_z
home: 0.7

[model_part beam]
file: models/beam.glb
parent: gantry
joint: linear
axis: 0, 1, 0
source: machine_y
home: 139.1

[model_part carriage]
file: models/carriage.glb
parent: beam
joint: linear
axis: 1, 0, 0
source: machine_x
home: 175

# The trunnion is not wired yet, so on the printer it is drawn but does not
# move. The twin turns these joints on in twin.cfg. Once it is wired, switch
# tilt and rotary to the commented lines.
[model_part trunnion]
file: models/trunnion.glb

[model_part tilt]
file: models/tilt.glb
parent: trunnion
joint: fixed
#joint: rotary
#axis: 1, 0, 0
#origin: 175, 175, 5
#source: a

[model_part rotary]
file: models/rotary.glb
parent: tilt
joint: fixed
#joint: rotary
#axis: 0, 0, 1
#origin: 175, 175, 0
#source: c
