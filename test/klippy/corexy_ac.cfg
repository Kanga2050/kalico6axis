[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250
min_extrude_temp: 0

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: PH6

[rotary_a]
step_pin: PC1
dir_pin: PC3
enable_pin: !PC7
microsteps: 16
gear_ratio: 4:1
pivot: 100, 20
max_velocity: 90
max_accel: 900
position_min: -100
position_max: 100

[rotary_c]
step_pin: PC0
dir_pin: PC2
enable_pin: !PC4
microsteps: 16
gear_ratio: 4:1
pivot: 100, 100
max_velocity: 180
max_accel: 1800

[input_shaper]
shaper_freq_x: 60
shaper_freq_y: 50

[bed_mesh]
mesh_min: 10, 10
mesh_max: 190, 190

[firmware_retraction]
retract_length: 1

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: corexy_ac
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 30
