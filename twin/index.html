<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5-Axis Printer Twin</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <header>
    <div class="brand">5-Axis Printer Twin</div>
    <nav>
      <button data-mode="live" class="tab active">Live</button>
      <button data-mode="sim" class="tab">Simulate</button>
    </nav>
    <div id="conn" class="chip">Not connected</div>
  </header>
  <main>
    <aside>
      <section id="live-panel">
        <h3>Printer</h3>
        <div class="row">
          <input id="host" placeholder="192.168.86.31" spellcheck="false">
          <button id="connect">Connect</button>
        </div>
        <label class="check"><input type="checkbox" id="follow-file" checked> Show the job's toolpath</label>
      </section>
      <section id="sim-panel" hidden>
        <h3>G-code</h3>
        <div class="row">
          <input type="file" id="file" accept=".gcode,.gco,.g,.txt">
        </div>
        <div class="row">
          <button id="play">Play</button>
          <select id="rate">
            <option value="1">1×</option><option value="2">2×</option><option value="5">5×</option>
            <option value="10" selected>10×</option><option value="50">50×</option><option value="200">200×</option><option value="1000">1000×</option>
          </select>
          <button id="end">End</button>
        </div>
        <input type="range" id="scrub" min="0" max="1000" value="0">
        <div class="kv"><span>Time</span><b id="sim-time">–</b></div>
        <h3>Manual pose</h3>
        <div class="slider"><span>A</span><input type="range" id="man-a" min="-100" max="100" value="0" step="0.5"><b id="man-a-v">0°</b></div>
        <div class="slider"><span>C</span><input type="range" id="man-c" min="-360" max="360" value="0" step="1"><b id="man-c-v">0°</b></div>
        <ul id="warnings"></ul>
      </section>
      <section>
        <h3>Position</h3>
        <table class="pos">
          <thead><tr><th></th><th>Part</th><th>Machine</th></tr></thead>
          <tbody>
            <tr><td>X</td><td id="px">–</td><td id="mx">–</td></tr>
            <tr><td>Y</td><td id="py">–</td><td id="my">–</td></tr>
            <tr><td>Z</td><td id="pz">–</td><td id="mz">–</td></tr>
            <tr><td>A</td><td id="pa">–</td><td></td></tr>
            <tr><td>C</td><td id="pc">–</td><td></td></tr>
            <tr><td>E</td><td id="pe">–</td><td></td></tr>
          </tbody>
        </table>
      </section>
      <section>
        <h3>Job</h3>
        <div class="kv"><span>State</span><b id="state">–</b></div>
        <div class="kv"><span>File</span><b id="fname">–</b></div>
        <div class="bar"><div id="progress"></div></div>
        <div class="kv"><span>Hotend</span><b id="hotend">–</b></div>
        <div class="kv"><span>Bed</span><b id="bed">–</b></div>
      </section>
      <section>
        <h3>View</h3>
        <label class="check"><input type="checkbox" id="panels" checked> Clear panels</label>
        <label class="check"><input type="checkbox" id="whole"> Whole toolpath</label>
        <div id="legend"></div>
      </section>
      <pre id="log"></pre>
    </aside>
    <div id="view">
      <canvas id="c"></canvas>
      <div id="loading">Loading printer model…</div>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
