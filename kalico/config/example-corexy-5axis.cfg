# This file is an example config file for corexy printers with a
# rotary A axis (around X) and a rotary C axis (around Z).

# DO NOT COPY THIS FILE WITHOUT CAREFULLY READING AND UPDATING IT
# FIRST. Incorrectly configured parameters may cause damage.

# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: PH6

[manual_stepper a]
step_pin: PC1
dir_pin: PC3
enable_pin: !PC7
microsteps: 16
rotation_distance: 360
gear_ratio: 4:1
endstop_pin: ^PE4
position_min: -100
position_max: 100
velocity: 60
accel: 600

[manual_stepper c]
step_pin: PC0
dir_pin: PC2
enable_pin: !PC4
microsteps: 16
rotation_distance: 360
gear_ratio: 4:1
endstop_pin: ^PD2
velocity: 90
accel: 900

[gcode_macro _REGISTER_AC]
gcode:
  MANUAL_STEPPER STEPPER=a GCODE_AXIS=A LIMIT_VELOCITY=60 LIMIT_ACCEL=600
  MANUAL_STEPPER STEPPER=c GCODE_AXIS=C LIMIT_VELOCITY=90 LIMIT_ACCEL=900

[gcode_macro HOME_AC]
gcode:
  MANUAL_STEPPER STEPPER=a GCODE_AXIS=
  MANUAL_STEPPER STEPPER=c GCODE_AXIS=
  MANUAL_STEPPER STEPPER=a ENABLE=1
  MANUAL_STEPPER STEPPER=a SET_POSITION=100
  MANUAL_STEPPER STEPPER=a STOP_ON_ENDSTOP=1 MOVE=-100 SPEED=20
  MANUAL_STEPPER STEPPER=a SET_POSITION=-95
  MANUAL_STEPPER STEPPER=a MOVE=0
  MANUAL_STEPPER STEPPER=c ENABLE=1
  MANUAL_STEPPER STEPPER=c SET_POSITION=0
  MANUAL_STEPPER STEPPER=c STOP_ON_ENDSTOP=1 MOVE=-370 SPEED=30
  MANUAL_STEPPER STEPPER=c SET_POSITION=0
  _REGISTER_AC

[delayed_gcode register_ac]
initial_duration: 0.1
gcode:
  _REGISTER_AC

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 30
